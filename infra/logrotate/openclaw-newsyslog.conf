# newsyslog config for OpenClaw logs
# Install: sudo cp this file to /etc/newsyslog.d/openclaw.conf
#
# Fields: logfile  owner:group  mode  count  size(KB)  when  flags  pidfile
#
# Defense: prevents log files from growing unbounded (disk exhaustion attack)
# and ensures audit trail is preserved (rotated, not deleted).

/Users/leka/.openclaw/logs/gateway.log          leka:staff  640  7  1024  *  J
/Users/leka/.openclaw/logs/gateway.err.log      leka:staff  640  7  512   *  J
/Users/leka/.openclaw/logs/config-audit.jsonl    leka:staff  640  14 512   *  J
/Users/leka/.openclaw/logs/commands.log          leka:staff  640  14 1024  *  J
/Users/leka/.openclaw/logs/watchdog.log          leka:staff  640  7  256   *  J
/Users/leka/.openclaw/logs/watchdog.err.log      leka:staff  640  7  256   *  J
