# pf-openclaw.conf — packet filter rules for OpenClaw exec sandbox
#
# Defense: even if an exec command has network access (exec-sandbox-net.sb),
# it can only reach whitelisted domains. Prevents data exfiltration via
# DNS tunneling, HTTP POST to attacker servers, etc.
#
# Install: sudo cp to /etc/pf.anchors/openclaw
#          Add to /etc/pf.conf: anchor "openclaw"
#                                load anchor "openclaw" from "/etc/pf.anchors/openclaw"
#
# Whitelisted destinations (add as needed):
#   - api.anthropic.com         (LLM API)
#   - api.telegram.org          (Telegram bot)
#   - generativelanguage.googleapis.com (Gemini)
#   - github.com, api.github.com (git operations)
#   - registry.npmjs.org        (npm packages)
#   - DNS (port 53)             (name resolution)

# Table of allowed hosts (resolved IPs — update via apply-egress.sh)
table <openclaw_allowed> persist

# Allow loopback
pass quick on lo0 all

# Allow DNS (needed for name resolution)
pass out quick proto { tcp, udp } to any port 53

# Allow HTTPS to whitelisted hosts
pass out quick proto tcp to <openclaw_allowed> port { 80, 443 }

# Allow established connections
pass out quick proto tcp flags A/A

# Block everything else outbound from sandboxed processes
# NOTE: this affects ALL processes. Use with caution.
# For per-process filtering, use the sandbox-exec no-net profile instead.
# Uncomment only if you want system-wide egress filtering:
# block out log quick proto { tcp, udp } to any

# If you want to be selective (recommended), use the sandbox no-net profile
# for exec commands and only apply pf rules to the OpenClaw gateway process.
